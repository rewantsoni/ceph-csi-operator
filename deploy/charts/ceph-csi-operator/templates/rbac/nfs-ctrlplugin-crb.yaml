apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ceph-csi-operator.resourceName" (dict "suffix" "nfs-ctrlplugin-crb" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ceph-csi-operator.resourceName" (dict "suffix" "nfs-ctrlplugin-cr" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "ceph-csi-operator.resourceName" (dict "suffix" "nfs-ctrlplugin-sa" "context" $) }}
  namespace: {{ .Release.Namespace }}
