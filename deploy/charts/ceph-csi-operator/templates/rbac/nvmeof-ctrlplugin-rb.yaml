apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ceph-csi-operator.resourceName" (dict "suffix" "nvmeof-ctrlplugin-rb" "context" $) }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ceph-csi-operator.resourceName" (dict "suffix" "nvmeof-ctrlplugin-r" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "ceph-csi-operator.resourceName" (dict "suffix" "nvmeof-ctrlplugin-sa" "context" $) }}
  namespace: {{ .Release.Namespace }}
